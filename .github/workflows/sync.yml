name: Sync the formula

# The tap points at a published release.  A pre-release is never picked up:
# `releases/latest` skips them, so the tap only moves on a final release.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to point the formula at (defaults to the latest final release)
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The upstream checkout is ignored by the tap's .gitignore, so it
      # cannot end up in the tap itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: grayslawson/osprey
          path: upstream
          ref: main
      - name: Find the latest release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$(curl -fsSL 'https://api.github.com/repos/grayslawson/osprey/releases?per_page=20' \
            | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin) if not r["draft"] and not r["prerelease"]]; print(rs[0]["tag_name"] if rs else "")')"
          if [ -z "$tag" ]; then
            echo 'No final release yet; the tap stays where it is.' >&2
            exit 0
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Point the formula at the release
        if: steps.release.outputs.version != ''
        run: upstream/scripts/sync-homebrew-tap.sh upstream . "${{ steps.release.outputs.version }}"
      - name: Commit the formula
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'The formula is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: point the formula at ${{ steps.release.outputs.version }}"
          git push
